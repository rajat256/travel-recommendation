<!DOCTYPE html>
<html>
<head>
    <title>Travel Recommendation</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            background: #333;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        .search-box input {
            padding: 6px;
        }

        .search-box button {
            padding: 6px 10px;
            margin-left: 5px;
        }

        .content {
            padding: 20px;
        }

        .card {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            display: inline-block;
            width: 250px;
        }

        .card img {
            width: 100%;
            height: 150px;
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search...">
        <button onclick="search()">Search</button>
        <button onclick="clearResults()">Clear</button>
    </div>

</div>

<div class="content">
    <h1>Travel Recommendation</h1>

    <div id="results"></div>
</div>

<script>

const data = {
    beach: [
        {
            name: "Goa Beach",
            img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Palolem_Beach%2C_Goa.jpg"
        },
        {
            name: "Marina Beach",
            img: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Marina_Beach_Chennai.jpg"
        }
    ]
};

function search() {
    let value = document.getElementById("searchInput").value.toLowerCase();
    let resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";

    if (data[value]) {
        data[value].forEach(item => {
            resultsDiv.innerHTML += `
                <div class="card">
                    <img src="${item.img}">
                    <h3>${item.name}</h3>
                </div>
            `;
        });
    } else {
        resultsDiv.innerHTML = "<p>No results found</p>";
    }
}

function clearResults() {
    document.getElementById("searchInput").value = "";
    document.getElementById("results").innerHTML = "";
}

</script>

</body>
</html>
